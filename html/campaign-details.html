<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaign Details</title>
    <link rel="stylesheet" href="../css/details.css" />
    <link rel="stylesheet" href="../css/general.css" />
  </head>
  <body>
    <div class="container">
      <img id="campaignImage" class="campaign-image" alt="Campaign Image" />

      <h1 id="campaignTitle"></h1>
      <p id="campaignCreator"></p>
      <p id="campaignDescription"></p>

      <div class="info">
        <p id="campaignGoal"></p>
        <p>End Date: <span id="campaignEndDate"></span></p>
        <p>Reward: <span id="campaignReward"></span></p>
      </div>
      <button>Pledge</button>
      <button id="edit">Edit Details</button>
    </div>

    <script src="../javascript/details.js"></script>
  </body>
</html>
